name: Pages

on:
  push:
    branches:
      - main # default branch

# 同一分支的两次 push 不并发部署，后一次取消前一次未完成的运行
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # If your repository depends on submodule, please see: https://github.com/actions/checkout
          submodules: recursive
          # 需要完整历史：下面的步骤要用每篇文章最后一次提交时间还原 mtime
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm" # 只缓存 ~/.npm 下载缓存，key 自动带 package-lock.json 的哈希
      - name: Install Dependencies
        # 用 npm ci 严格按 package-lock.json 装，避免旧 node_modules 树上做增量安装
        run: npm ci
      - name: Restore mtimes from git history
        # 文章页的「更新于」来自文件 mtime（_config.yml updated_option: mtime）。
        # 全新 clone 里所有文件的 mtime 都是 checkout 的那一刻，会让全站「更新于」显示成构建时间。
        # 这里按每篇文章最后一次提交的时间还原 mtime，让「更新于」等于真实改动时间。
        run: |
          git ls-files -z source/_posts | while IFS= read -r -d '' f; do
            t=$(git log -1 --format=%cI -- "$f")
            [ -n "$t" ] && touch -d "$t" "$f"
          done
          echo "还原后抽样："
          git ls-files source/_posts | head -3 | xargs -r ls -l --time-style=+%Y-%m-%d_%H:%M
      - name: Build
        run: npm run build
      - name: Check internal links
        # 站内死链（含首页分类卡 404）直接失败，不发布
        run: python3 tools/check-links.py
      - name: Report unpublished drafts
        # 非阻断提示：列出 published: false 的草稿，避免忘了发布
        run: |
          drafts=$(grep -rlE '^published:[[:space:]]*false' source/_posts --include='*.md' || true)
          if [ -n "$drafts" ]; then
            echo "::notice::有 $(echo "$drafts" | wc -l) 篇草稿未发布（published: false）"
            echo "$drafts"
          else
            echo "没有草稿"
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
